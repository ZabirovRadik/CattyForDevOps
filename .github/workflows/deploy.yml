name: CD - Deploy with Docker Compose

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
  
    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 2462
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          echo "🚀 Deploying release: ${{ github.event.release.tag_name }}"
          
          echo "${{ secrets.TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          cd /home/ubuntu/DevOPs/DevOps1/CattyForDevOps
          
          sudo git fetch origin
          sudo git checkout ${{ github.event.release.tag_name }} || sudo git pull origin main
          
          sudo docker compose down
          sudo docker compose pull
          sudo docker compose up -d
          
          echo "📊 Checking services..."
          sudo docker compose ps
          
          echo "🔍 Checking application health..."
          sleep 20
          curl -f http://app.zabirov.course.prafdin.ru/login || echo "⚠️ Application might be starting..."
          
          echo "✅ Release ${{ github.event.release.tag_name }} deployed successfully!"
          echo "🌐 Available at: http://app.zabirov.course.prafdin.ru"