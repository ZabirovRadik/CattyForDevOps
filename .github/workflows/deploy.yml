name: CD - Deploy Docker Container

on:
  workflow_run:
    workflows: ["CI Pipeline with Docker"]
    types:
      - completed
    branches: [Docker]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Deploy Docker Container
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 2462
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          echo "🚀 Starting Docker deployment..."
          echo "📱 Target: http://app.zabirov.course.prafdin.ru"
          
          echo "Logging to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "Pulling new image..."
          sudo docker pull ghcr.io/${{ github.repository_owner }}/catty-app:latest
          
          echo "🔄 Restarting container..."
          sudo docker stop catty-app || true
          sudo docker rm catty-app || true
          
          echo "Starting new container..."
          sudo docker run -d \
            --name catty-app \
            --restart unless-stopped \
            -p 8181:8181 \
            -e PYTHONPATH="/opt/CattyForDevOps" \
            ghcr.io/${{ github.repository_owner }}/catty-app:latest
          
          echo "📊 Checking deployment..."
          sleep 3
          sudo docker ps
          
          echo "🔍 Testing application..."
          curl -f http://app.zabirov.course.prafdin.ru/login && echo "✅ Application is running!" || echo "⚠️ Application might be starting..."
          
          echo "🎉 Docker deployment completed!"
          echo "🌐 Available at: http://app.zabirov.course.prafdin.ru"