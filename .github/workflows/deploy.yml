name: CD - Deploy with Docker Compose

on:
  workflow_run:
    workflows: ["CI Pipeline with Docker"]
    types:
      - completed
    branches: [Docker-compose]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: Docker-compose 

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
  
    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 2462
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          echo "🚀 Deploying with Docker Compose..."
          
          # Используйте GITHUB_TOKEN вместо TOKEN
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          cd /home/ubuntu/DevOPs/DevOps1/CattyForDevOps
          
          # Обновляем код
          sudo git pull origin Docker-compose
          
          sudo docker compose down
          sudo docker compose pull backend
          sudo docker compose up -d
          
          echo "📊 Checking services..."
          sudo docker compose ps
          
          echo "🔍 Checking application health..."
          sleep 20
          curl -f http://app.zabirov.course.prafdin.ru/login || echo "⚠️ Application might be starting..."
          
          echo "✅ Docker Compose deployment completed!"
          echo "🌐 Available at: http://app.zabirov.course.prafdin.ru"