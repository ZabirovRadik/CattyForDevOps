name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies and build
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ Build completed on GitHub Runner"
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          APP_DIR="/opt/CattyForDevOps"
          SERVICE_NAME="catty.service"
          
          echo "🚀 Starting deployment..."
          
          # Создаём директорию для приложения
          sudo mkdir -p $APP_DIR
          sudo rm -rf $APP_DIR/*
          sudo cp -r "/home/ubuntu/DevOPs/DevOps1/CattyForDevOps" "/opt"
          sudo chown -R ubuntu:ubuntu $APP_DIR
          cd $APP_DIR
          
          # Активируем venv и устанавливаем зависимости
          if [ ! -d "/home/ubuntu/DevOPs/DevOps1/venv" ]; then	
             python3 -m venv /home/ubuntu/DevOPs/DevOps1/venv
          fi
          source /home/ubuntu/DevOPs/DevOps1/venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Создаём/обновляем systemd service
          sudo tee /etc/systemd/system/$SERVICE_NAME > /dev/null <<EOF
          [Unit]
          Description=Catty Reminders App
          After=network.target
          
          [Service]
          User=ubuntu
          WorkingDirectory=$APP_DIR
          ExecStart=/home/ubuntu/DevOPs/DevOps1/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8181
          Restart=always
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          sudo systemctl daemon-reload
          sudo systemctl enable $SERVICE_NAME
          sudo systemctl restart $SERVICE_NAME
          
          echo "✅ Deployment completed!"
          echo "📱 Application available at: http://app.zabirov.course.prafdin.ru"