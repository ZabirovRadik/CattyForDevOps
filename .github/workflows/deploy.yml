name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies and build
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ Build completed on GitHub Runner"
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Deploy using webhook logic
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 2462
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          DEPLOY_DIR="/opt/CattyForDevOps"
          MAIN_DIR="/home/ubuntu/DevOPs/DevOps1/CattyForDevOps"
          
          echo "🚀 Starting deployment using webhook logic..."
          
          # Создаём директорию для приложения
          sudo mkdir -p $DEPLOY_DIR
          sudo chown -R ubuntu:ubuntu $DEPLOY_DIR
          
          # Копируем код в DEPLOY_DIR 
          echo "📦 Updating application code..."
          sudo rm -rf $DEPLOY_DIR/*
          sudo cp -r "$MAIN_DIR"/* $DEPLOY_DIR/
          sudo chown -R ubuntu:ubuntu $DEPLOY_DIR
          cd $DEPLOY_DIR
          
          # build.sh (если есть)
          build_script="$MAIN_DIR/build.sh"
          if [ -f "$build_script" ]; then
            echo "🔧 Running build.sh..."
            bash "$build_script"
          fi
          
          # test.sh (если есть)
          test_script="$MAIN_DIR/test.sh"
          if [ -f "$test_script" ]; then
            echo "🧪 Running tests..."
            if bash "$test_script"; then
              echo "✅ Tests passed"
            else
              echo "❌ Tests failed - deployment cancelled"
              exit 1
            fi
          fi
          
          # deploy.sh (если есть)
          deploy_script="$MAIN_DIR/deploy.sh"
          if [ -f "$deploy_script" ]; then
            echo "🚀 Running deploy.sh..."
            bash "$deploy_script"
            echo "✅ Deployment completed"
          else
            echo "⚠️ No deploy.sh, only code updated"
            
            # Минимальный деплой если нет deploy.sh
            VENV_PATH="/home/ubuntu/venv"
            if [ ! -d "$VENV_PATH" ]; then	
              python3 -m venv $VENV_PATH
            fi
            source $VENV_PATH/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Перезапускаем сервис
            sudo systemctl restart catty.service
          fi
          
          echo "🎉 Application deployed successfully!"
          echo "📱 Available at: http://app.zabirov.course.prafdin.ru"