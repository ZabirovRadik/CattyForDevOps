name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium
        
    - name: Run tests
      run: |
        pytest -v tests/test_unit.py
        # Запускаем API тесты на временном сервере
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8181 &
        SERVER_PID=$!
        sleep 5
        pytest -v tests/test_api.py
        kill $SERVER_PID
        
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 2462
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          DEPLOY_DIR="/opt/CattyForDevOps"
          MAIN_DIR="/home/ubuntu/DevOPs/DevOps1/CattyForDevOps"

          echo "📥 Pulling latest code from repository..."
          cd "$MAIN_DIR"
          git fetch origin
          git reset --hard origin/github-actions

          echo "🚀 Starting deployment..."
          
          # Копируем код в DEPLOY_DIR 
          echo "📦 Updating application code..."
          sudo mkdir -p $DEPLOY_DIR
          sudo rm -rf $DEPLOY_DIR/*
          sudo cp -r "$MAIN_DIR"/* $DEPLOY_DIR/
          sudo chown -R ubuntu:ubuntu $DEPLOY_DIR
          
          # Запускаем deploy.sh
          echo "🔧 Running deploy.sh..."
          bash "$DEPLOY_DIR/deploy.sh""
          
          echo "🎉 Application deployed successfully!"
          echo "📱 Available at: http://app.zabirov.course.prafdin.ru"