name: CI Pipeline with Docker

on:
  push:
    branches: [ Docker-compose ]
  pull_request:
    branches: [ Docker-compose ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker image
      run: |
        docker build -t catty-app .
    - name: Debug application startup
      run: |
        # Запускаем в интерактивном режиме чтобы увидеть ошибку
        echo "🚨 Running app in foreground to see error:"
        docker run --rm -p 8181:8181 catty-app
    
        # Или альтернативно - запускаем и сразу смотрим статус
        echo "🔍 Alternative debug:"
        docker run -d -p 8181:8181 --name test-app catty-app
        sleep 2
        docker ps -a
        docker logs test-app || echo "Container already stopped"
    - name: Start application and run basic health check
      run: |
        docker ps -a
        echo "📜 Container logs:"
        docker logs test-app
        echo "🔄 Waiting for app to start..."
        sleep 10
        
        # Базовая проверка что приложение работает
        curl -f http://localhost:8181/ && echo "✅ App is running!"
        
    - name: Run integration tests
      run: |
         docker exec test-app python -m pytest tests/ -v
        
    - name: Cleanup
      if: always()
      run: |
        docker stop test-app || true
        docker rm test-app || true

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
      continue-on-error: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}