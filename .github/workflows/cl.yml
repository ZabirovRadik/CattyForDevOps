name: CI Pipeline

on:
  push:
    branches: [ main, github-actions ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest playwright
        playwright install
        
    - name: Start application on GitHub Runner
      run: |
        # Запускаем приложение НА СЕРВЕРЕ GITHUB
        uvicorn app.main:app --host 0.0.0.0 --port 8181 &
        echo "🔄 Waiting for app to start..."
        sleep 10
        
        curl -f http://localhost:8181/ || echo "App might be starting..."
        
    - name: Run tests on GitHub Runner
      run: |
        python -m pytest tests/ -v