name: CI Pipeline with Docker

on:
  push:
    branches: [ Docker ]
  pull_request:
    branches: [ Docker ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker image
      run: |
        docker build -t catty-app .
        
    - name: Start application and run basic health check
      run: |
        docker run -d -p 8181:8181 --name test-app catty-app
        echo "🔄 Waiting for app to start..."
        sleep 10
        
        # Базовая проверка что приложение работает
        curl -f http://localhost:8181/ && echo "✅ App is running!"
        
    - name: Run integration tests
      run: |
        # Если нужны UI-тесты с Playwright
        python -m pip install playwright
        playwright install
        
        # Запускаем интеграционные тесты против запущенного контейнера
        python -m pytest tests/ -v -k "integration"
        
    - name: Cleanup
      if: always()
      run: |
        docker stop test-app || true
        docker rm test-app || true

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
      continue-on-error: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}