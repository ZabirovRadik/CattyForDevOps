name: CI Pipeline with Docker

on:
  push:
    branches: [ Docker-compose ]
  pull_request:
    branches: [ Docker-compose ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Start services with Docker Compose
      run: |
        docker compose up -d
        sleep 20
    
        
    - name: Start application and run basic health check
      run: |
        docker ps -a
        
        # Базовая проверка что приложение работает
        curl -f http://localhost:8181/ && echo "✅ App is running!"
        
    - name: Run integration tests
      run: |
        pip install -r requirements.txt
        if ! python -m pytest tests/test_unit.py -v; then
          echo "==== Backend logs ===="
          docker logs catty-backend
          exit 1
        fi
        
    - name: Cleanup
      if: always()
      run: |
        docker compose down

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
      continue-on-error: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
            ghcr.io/zabirovradik/catty-app:latest
            ghcr.io/zabirovradik/catty-app:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max