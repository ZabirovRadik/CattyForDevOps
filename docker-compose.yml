name: catty-reminders

services:
  database:
    image: mysql:8.0
    container_name: catty-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
      MYSQL_USER: root
      MYSQL_PASSWORD: mypass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      catty-network:
        aliases:
          - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmypass"]
      timeout: 20s
      retries: 10

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: catty-backend  
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      PYTHONPATH: "/opt/CattyForDevOps"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - catty-network

networks:
  catty-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local