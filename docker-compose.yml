name: catty-reminders

services:
  database:
    image: mysql:8.0
    container_name: catty-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
      MYSQL_USER: root
      MYSQL_PASSWORD: mypass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - catty-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmypass"]
      timeout: 20s
      retries: 10
      start_period: 30s

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: catty-backend  
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      PYTHONPATH: "/opt/CattyForDevOps"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "mypass"
      DB_NAME: "catty_reminders"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - catty-network

networks:
  catty-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local